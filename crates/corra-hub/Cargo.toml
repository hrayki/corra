[package]
name = "corra-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Corra's hub: it keeps the threads and keys, makes and sleeps machines, and serves the app"

[dependencies]
aes-gcm = "0.11"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.8", features = ["derive", "env"] }
corra-proto = { version = "0.1.0", path = "../corra-proto" }
flate2 = "1.1.11"
futures-util = "0.3.34"
hkdf = "0.13"
mime_guess = "2.0.5"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "query"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = "8.14.0"
rusty-s3 = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3"
