<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corra</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; background: light-dark(#fbfbfa, #141413); color: light-dark(#1d1c1a, #ecebe7); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(360px, 88vw); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: light-dark(#6f6c66, #9a978f); font-size: 13px; }
  input { box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid light-dark(#e4e2dd, #2e2d2a); background: light-dark(#fff, #232321); color: inherit; font: inherit; }
  button { margin-top: 10px; width: 100%; padding: 10px; border-radius: 10px; border: 0; background: light-dark(#1d1c1a, #ecebe7); color: light-dark(#fbfbfa, #141413); font: inherit; font-weight: 600; }
  .err { color: #dc2626; font-size: 13px; min-height: 20px; margin-top: 8px; }
  .mark { display: block; width: 44px; height: 44px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; margin: 12px 0 6px; }
  .alt { margin-top: 12px; font-size: 13px; }
  .alt a, .back a { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: light-dark(#d4d1ca, #3c3a36); }
  .back { margin-top: 18px; font-size: 13px; color: light-dark(#6f6c66, #9a978f); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="32" fill="#33455a"/>
    <path d="M34.6 20A16 16 0 1 0 39.7 48.6" fill="none" stroke="#eceae5" stroke-width="7" stroke-linecap="round"/>
    <path d="M34.1 16.9Q25 11.8 12.1 17.1Q23.7 15.7 30.8 16.4Z" fill="#eceae5"/>
    <path d="M34.3 23.6L57.4 26.2L36.1 16.8Z" fill="#ff8a4c"/>
    <circle cx="33.9" cy="19.3" r="1.15" fill="#33455a"/>
  </svg>
  <h1 id="title">Connect to your hub</h1>
  <p id="lead">{{host}} becomes one of your hub's machines, and its threads live on the hub.</p>
  <form id="f">
    <label for="u">The hub's address</label>
    <input id="u" type="url" inputmode="url" autocomplete="url" placeholder="https://" required value="{{current}}" />
    <div id="by-key">
      <label for="k">The hub's access key</label>
      <input id="k" type="password" autocomplete="current-password" />
    </div>
    <div id="by-code" hidden>
      <label for="c">A pairing code from the hub's Settings, under Devices</label>
      <input id="c" autocomplete="one-time-code" autocapitalize="characters" />
    </div>
    <button id="go">Connect</button>
    <div class="err" id="e" role="alert"></div>
    <div class="alt"><a href="#" id="swap">Use a pairing code instead</a></div>
  </form>
  <div class="back" id="back" hidden><a href="#">Keep using {{current}}</a></div>
</main>
<script src="/desktop/connect.js"></script>
</body>
</html>
