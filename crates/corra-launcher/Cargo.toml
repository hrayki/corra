[package]
name = "corra-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Corra's container entry point: it fetches the hub release it's told to run, starts it, and rolls back a version that doesn't come up"

[dependencies]
anyhow = "1.0.104"
libc = "0.2"
rusty-s3 = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
