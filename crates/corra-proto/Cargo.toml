[package]
name = "corra-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The types corra's hub, runner and app share"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }
